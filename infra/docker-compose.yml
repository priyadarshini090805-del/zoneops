version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: zoneops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zoneops
      POSTGRES_PASSWORD: zoneops
      POSTGRES_DB: zoneops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/postgres-init.sql

  redis:
    image: redis:7
    container_name: zoneops-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data: